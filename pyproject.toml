[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sentinelwall"
version = "1.0.0"
description = "Autonomous AI-powered network threat detection, correlation and response engine"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
authors = [
    {name = "5h4d0wn1k", email = "5h4d0wn1k@users.noreply.github.com"},
]
keywords = ["security", "ids", "xdr", "threat-detection", "mitre-attack", "network-security", "anomaly-detection"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Information Technology",
    "Intended Audience :: System Administrators",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Security",
    "Topic :: System :: Networking :: Monitoring",
    "Typing :: Typed",
]
dependencies = []

[project.optional-dependencies]
capture = ["scapy>=2.5.0"]
ml = ["scikit-learn>=1.3.0", "numpy>=1.24.0"]
web = ["flask>=3.0.0"]
all = ["scapy>=2.5.0", "scikit-learn>=1.3.0", "numpy>=1.24.0", "flask>=3.0.0"]
dev = [
    "pytest>=7.4.0",
    "pytest-cov>=4.1.0",
    "pytest-timeout>=2.2.0",
    "mypy>=1.7.0",
    "ruff>=0.1.0",
]

[project.scripts]
sentinelwall = "sentinelwall.cli.main:main"

[project.urls]
Homepage = "https://github.com/5h4d0wn1k/sentinelwall"
Documentation = "https://sentinelwall.readthedocs.io"
Repository = "https://github.com/5h4d0wn1k/sentinelwall"
Issues = "https://github.com/5h4d0wn1k/sentinelwall/issues"

[tool.setuptools.packages.find]
include = ["sentinelwall*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --tb=short"
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "integration: marks tests requiring external dependencies",
]

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "A", "SIM"]
